<!doctype html>
<html lang="fr-CA">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Réservation | L'Orléans</title>
    <link rel="icon" type="image/o-icon" href="img/favicon.ico" />

    <meta
      name="description"
      content="Faire une réservation sur nos plages horaires disponibles"
    />

    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <header>
      <div class="container flex-header">
        <div class="logo">
          <a href="index.html"
            ><img src="img/L'Orléans.png" alt="Restaurant L'Orléans"
          /></a>
        </div>

        <nav>
          <a href="index.html">Accueil</a>
          <a class="currentpage" href="réservation.html">Réservation</a>
          <a href="restaurant.html">Restaurant</a>
          <a href="ma_commande.html">Ma commande</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1>Réservation</h1>
        <fieldset class="formlayout">
          <form id="frm-reservation">
            <div class="formcontent">
              <label for="text-nom-complet">Prénom : <span>*</span></label>
              <input type="text" id="text-nom-complet" name="text-nom-complet" required>
            </div>

            <div class="formcontent">
              <label for="text-nom-complet">Nom : <span>*</span></label>
              <input type="text" id="text-nom-complet" name="text-nom-complet" required>
            </div>

            <div class="formcontent">
              <label for="txt-phonenum">Numéro de téléphone : <span>*</span></label>
              <input type="text" id="txt-phonenum" name="txt-phonenum" placeholder="(123) 456-7890" required>
            </div>

            <div class="formcontent">
              <label for="num-numofperson">Nombre de personnes présentes pour la réservation (Maximum 8): <span>*</span></label>
              <input type="number" id="num-numofperson" name="num-numofperson" value="1" min="1" max="8" required>
            </div>
            
            <div class="formcontent">
              <label for="date-reservation">Date de la réservation : <span>*</span></label>
              <input type="date" id="date-reservation" name="date-reservation" required>
            </div>

            <fieldset class="formcontent">
              <legend>Type de réservation, parmis les 2 choix suivants : <span>*</span></legend>
              <div>
                <input type="radio" name="rdo-reservation" id="reservation-sam" value="sam" checked>
                <label for="reservation-sam">Salle à manger<label>
              </div>
              <div>
                <input type="radio" name="rdo-reservation" id="reservation-ter" value="ter">
                <label for="reservation-ter">Terrasse<label>
              </div>
            </fieldset>

            <div class="formcontent">
              <label for="sel-reservation">Sélectionner l'heure de la réservation, parmis les choix suivants : <span>*</span></label>
              <select id="sel-logement" name="sel-logement" required>
                <option value="" selected>-- Sélection --</option>
                <option value="12:00">12:00</option>
                <option value="12:30">12:30</option>
                <option value="13:00">13:00</option>
                <option value="13:30">13:30</option>
                <option value="17:00">17:00</option>
                <option value="17:30">17:30</option>
                <option value="18:00">18:00</option>
                <option value="18:30">18:30</option>
                <option value="19:00">19:00</option>
                <option value="19:30">19:30</option>
                <option value="20:00">20:00</option>
                <option value="20:30">20:30</option>
                <option value="21:00">21:00</option>
            </select>
            </div>
        </fieldset>

        <br>
        
        <fieldset class="formlayout">
          <div class="formcontent">
            <legend>Commentaires :</legend>
            <textarea name="txt-commentaire" id="txt-commentaire"></textarea>
          </div>

          <div class="formcontent">
            <label for="email-client">Votre email :</label>
                  <input
                    type="email"
                    id="email-client"
                    name="email-client"
                    placeholder="xyz@exemple.com"
                  />
          </div>

          <div class="formcontent">
            <input type="checkbox" id="infolettre" name="infolettre" />
            <label for="infolettre">Je veux recevoir des infolettres</label>
          </div>
        </fieldset>

          <input type="submit" value="Réserver maintenant">
        </form>
      </div>
    </main>

    <footer>
      <div class="container footer-top">
          <div>✉ Réalisé par : Jérémy Roy-Pelletier</div>

          <div>
            Réseaux sociaux :
            <a href="#"><img src="img/Facebook.png" alt="Facebook"></a>
            <a href="#"><img src="img/Linkedin.png" alt="LinkedIn"></a>
            <a href="#"><img src="img/Twitter.png" alt="Twitter"></a>
            <a href="#"><img src="img/Instagram.png" alt="Instagram"></a>
          </div>
        </div>

        <hr class="container"/>

        <div class="container footer-bottom">
          Intégration web 1
          <div class="footer-bottom-right">
            <div>Cégep de Trois-Rivières</div>
            <div>Hiver 2026</div>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
